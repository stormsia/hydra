<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="hydraNeonIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="256" height="256" rx="52" fill="url(#bgIconGrad)" />
  <rect width="256" height="256" rx="52" fill="none" stroke="#1e293b" stroke-width="2.5" />

  <!-- Outer Hexagon fully inscribes the glow circle (Center: 128, 128; R: 98; inradius r: 84.87) -->
  <!-- Soft inner aura circle (radius: 84) perfectly inscribed tangent to the hexagon sides -->
  <circle cx="128" cy="128" r="84" fill="#00f2fe" opacity="0.06" />

  <!-- Outer Regular Hexagon (Center: 128, 128; Radius: 98) -->
  <!-- Points: (128, 30), (212.87, 79), (212.87, 177), (128, 226), (43.13, 177), (43.13, 79) -->
  <polygon points="128,30 212.87,79 212.87,177 128,226 43.13,177 43.13,79" 
           fill="none" 
           stroke="#1e293b" 
           stroke-width="2.2" 
           stroke-dasharray="8,6" />

  <!-- Central Origin Node (The Root / Router) at (128, 180) -->
  <circle cx="128" cy="180" r="7.5" fill="#38bdf8" />
  <circle cx="128" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Hydra Heads (Neural / Proxy Flow Lines) -->
  <!-- Middle Head -->
  <path d="M 128,172 L 128,68" 
        fill="none" 
        stroke="url(#hydraNeonIcon)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#iconGlow)" />

  <!-- Left Head -->
  <path d="M 122,168 C 104,150 78,132 78,88" 
        fill="none" 
        stroke="url(#hydraNeonIcon)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#iconGlow)" />

  <!-- Right Head -->
  <path d="M 134,168 C 152,150 178,132 178,88" 
        fill="none" 
        stroke="url(#hydraNeonIcon)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#iconGlow)" />

  <!-- Cross-Mesh Synchronization Line -->
  <path d="M 78,86 L 128,66 L 178,86" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="1.5" 
        stroke-dasharray="4,4" 
        opacity="0.65" />

  <!-- Active Head Vertices -->
  <!-- Middle Vertex (128, 66) -->
  <circle cx="128" cy="66" r="7.5" fill="#ffffff" filter="url(#iconGlow)" />
  <circle cx="128" cy="66" r="12" fill="none" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Left Vertex (78, 86) -->
  <circle cx="78" cy="86" r="6.5" fill="#ffffff" filter="url(#iconGlow)" />
  <circle cx="78" cy="86" r="11" fill="none" stroke="#00f2fe" stroke-width="2.5" />

  <!-- Right Vertex (178, 86) -->
  <circle cx="178" cy="86" r="6.5" fill="#ffffff" filter="url(#iconGlow)" />
  <circle cx="178" cy="86" r="11" fill="none" stroke="#10b981" stroke-width="2.5" />
</svg>