<svg xmlns="http://www.w3.org/2000/svg" width="206" height="20" role="img" aria-label="proxies: verified by hydra">
  <title>proxies: verified by hydra</title>
  <defs>
    <linearGradient id="pvbh_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="pvbh_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <g shape-rendering="crispEdges">
    <rect width="78" height="20" fill="#1e293b"/>
    <rect x="78" width="128" height="20" fill="url(#pvbh_bg)"/>
    <rect x="78" y="19" width="128" height="1" fill="#34d399" opacity="0.9"/>
  </g>
  <rect width="206" height="20" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.6"/>

  
  <g transform="translate(6, 3) scale(0.068)">
    <polygon points="128,30 212.87,79 212.87,177 128,226 43.13,177 43.13,79" 
             fill="none" stroke="#38bdf8" stroke-width="10" opacity="0.4" stroke-dasharray="16,14" />
    <circle cx="128" cy="180" r="18" fill="#38bdf8" />
    <path d="M 120,166 C 96,146 68,124 68,88" fill="none" stroke="url(#pvbh_grad)" stroke-width="17" stroke-linecap="round" />
    <path d="M 128,168 L 128,66" fill="none" stroke="url(#pvbh_grad)" stroke-width="17" stroke-linecap="round" />
    <path d="M 136,166 C 160,146 188,124 188,88" fill="none" stroke="url(#pvbh_grad)" stroke-width="17" stroke-linecap="round" />
    <path d="M 68,86 L 128,64 L 188,86" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="12,12" opacity="0.85" />
    <circle cx="128" cy="64" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="9" />
    <circle cx="68" cy="86" r="16" fill="#ffffff" stroke="#00f2fe" stroke-width="8" />
    <circle cx="188" cy="86" r="16" fill="#ffffff" stroke="#10b981" stroke-width="8" />
  </g>


  <!-- Uncompressed, crisp typography with healthy letter-spacing -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="51.0" y="14" fill="#e2e8f0" font-weight="400" letter-spacing="0.2">proxies</text>
    <text x="142.0" y="14" fill="#a7f3d0" font-weight="700" letter-spacing="0.3">verified by hydra</text>
